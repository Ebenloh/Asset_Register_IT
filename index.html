<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registre PC Auto — IT</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0f14'/%3E%3Crect x='5' y='7' width='22' height='14' rx='2' fill='none' stroke='%234f8ef7' stroke-width='1.8'/%3E%3Crect x='8' y='10' width='16' height='8' rx='1' fill='%234f8ef7' opacity='.18'/%3E%3Cline x1='10' y1='13' x2='16' y2='13' stroke='%234f8ef7' stroke-width='1.4' stroke-linecap='round'/%3E%3Cline x1='10' y1='15.5' x2='14' y2='15.5' stroke='%234f8ef7' stroke-width='1.4' stroke-linecap='round'/%3E%3Ccircle cx='20' cy='14' r='1.5' fill='%232dce7a'/%3E%3Crect x='13' y='21' width='6' height='2' rx='.5' fill='%234f8ef7' opacity='.5'/%3E%3Crect x='10' y='23' width='12' height='1.5' rx='.5' fill='%234f8ef7' opacity='.3'/%3E%3C/svg%3E" />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style/style.css" />
</head>
<body>

  <!-- ── En-tête ───────────────────────────── -->
  <header>
    <div class="header-badge">IT · Internal Tool</div>
    <h1>Registre <span>PC</span> Auto</h1>
    <p class="header-sub">
      Génération automatique des noms machine — zéro doublon garanti
    </p>
  </header>


  <!-- ── Onglets ───────────────────────────── -->
  <div class="tabs">

    <button
      type="button"
      class="tab-btn active"
      onclick="changerMode('add', event)"
    >
      Ajouter
    </button>

    <button
      type="button"
      class="tab-btn"
      onclick="changerMode('edit', event)"
    >
      Modifier
    </button>

    <button
      type="button"
      class="tab-btn"
      onclick="changerMode('delete', event)"
    >
      Supprimer
    </button>

  </div>


  <!-- ── Carte principale ─────────────────── -->
  <div class="card">

    <div class="card-header">
      <div class="dot"></div>
      <span>Gestion PC</span>
    </div>

    <div class="card-body">

      <form id="pc-form" novalidate>

        <!-- Recherche pour modifier/supprimer -->
        <div
          class="form-group full hidden"
          id="pc-id-group"
        >
          <label for="pcId">
            Nom PC à rechercher
            <span class="required">*</span>
          </label>

          <div class="search-row">
            <input
              type="text"
              id="pcId"
              placeholder="ex : ITY-LTOP-5001"
            />

            <button
              type="button"
              class="btn-search"
              onclick="rechercherPC()"
            >
              Rechercher
            </button>
          </div>
        </div>


        <!-- Type machine -->
        <div class="form-group full">
          <label>
            Type de machine
            <span class="required">*</span>
          </label>

          <div class="type-group">

            <div class="type-option">
              <input
                type="radio"
                name="typeMachine"
                id="type-laptop"
                value="Laptop"
              />

              <label
                class="type-label"
                for="type-laptop"
              >
                <span class="icon">💻</span>
                <span class="name">Laptop</span>
                <span class="preview">
                  ITY-LTOP-5534…
                </span>
              </label>
            </div>


            <div class="type-option">
              <input
                type="radio"
                name="typeMachine"
                id="type-desktop"
                value="Desktop"
              />

              <label
                class="type-label"
                for="type-desktop"
              >
                <span class="icon">🖥️</span>
                <span class="name">Desktop</span>
                <span class="preview">
                  ITY-DSK-2511…
                </span>
              </label>
            </div>

          </div>
        </div>


        <hr class="divider" />


        <!-- Formulaire -->
        <div class="form-grid">

          <!-- Nom -->
          <div class="form-group">
            <label for="nom">
              Nom
              <span class="required">*</span>
            </label>

            <input
              type="text"
              id="nom"
              placeholder="ex : EBEN LOH"
            />
          </div>


          <!-- Département -->
          <div class="form-group">
            <label for="department">
              Département
              <span class="required">*</span>
            </label>

            <input
              type="text"
              id="department"
              placeholder="ex : IT"
            />
          </div>


          <!-- Modèle -->
          <div class="form-group">
            <label for="modele">
              Modèle
              <span class="required">*</span>
            </label>

            <input
              type="text"
              id="modele"
              placeholder="ex : HP EliteBook 630"
            />
          </div>


          <!-- Date -->
          <div class="form-group">
            <label for="dateAttribution">
              Date d’attribution
              <span class="required">*</span>
            </label>

            <input
              type="date"
              id="dateAttribution"
            />
          </div>


          <!-- S/N -->
          <div class="form-group">
            <label for="numeroSerie">
              S/N
              <span class="required">*</span>
            </label>

            <input
              type="text"
              id="numeroSerie"
              placeholder="ex : H2RBCD4"
            />
          </div>


          <!-- MAC -->
          <div class="form-group">
            <label for="macAdress">
              Adresse MAC
              <span class="required">*</span>
            </label>

            <input
              type="text"
              id="macAdress"
              placeholder="24:6A:0E:D0:A3:2A"
            />
          </div>

        </div>


        <hr class="divider" />


        <!-- Bouton -->
        <button
          type="submit"
          class="btn-submit"
          id="btn-submit"
        >
          <span id="btn-text">
            Enregistrer le PC
          </span>
        </button>

      </form>

    </div>
  </div>


  <!-- ── Bannière résultat ───────────────── -->
  <div
    id="result-banner"
    role="alert"
    aria-live="polite"
  >
    <div class="banner-inner">

      <div class="banner-top">
        <div class="banner-icon"></div>
        <div
          class="banner-title"
          id="banner-title"
        ></div>
      </div>

      <div
        id="pc-name-block"
        style="display:none;"
      >
        <div class="pc-name-card">

          <div>
            <div class="pc-name-label">
              Nom PC attribué
            </div>

            <div
              class="pc-name-value"
              id="pc-name-value"
            ></div>
          </div>

          <button
            class="btn-copy"
            id="btn-copy"
            onclick="copyNomPC()"
          >
            Copier
          </button>

        </div>
      </div>

      <div
        class="banner-message"
        id="banner-message"
      ></div>

    </div>
  </div>


  <!-- ── Footer ─────────────────────────── -->
  <footer>
    © 2026 Service IT — Gestion des Ordinateurs d'ITY
  </footer>


  <script src="js/js.js"></script>
</body>
</html>
